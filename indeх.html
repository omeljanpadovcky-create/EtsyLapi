<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPI — Etsy to Shopify Migration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
// ===== 3D Tilt for Service Cards =====
document.querySelectorAll('.service-card').forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateX = (y - centerY) / 15;
    const rotateY = (centerX - x) / 15;
    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    card.style.setProperty('--mouse-x', x + 'px');
    card.style.setProperty('--mouse-y', y + 'px');
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
  });
});

// ===== Checkout Modal =====
const packages = {
  'consultation': { name: 'Consultation', price: 'Free', features: ['15-min shop review','Fee calculation','Migration plan','Q&A session','No obligations'], note: 'Free forever.' },
  'mini': { name: 'Mini Migration', price: '$199', features: ['Up to 20 products','Import from Etsy','Basic theme setup','Payments & shipping','1 revision'], note: 'One-time payment.' },
  'full': { name: 'Full Migration', price: '$349', features: ['Up to 100 products','Custom design','SEO setup','Email integration','Etsy stays active'], note: 'One-time payment.' },
  'premium': { name: 'Premium + Support', price: '$499', features: ['Unlimited products','Unique design','3 months support','Ad integrations','Priority response'], note: 'One-time payment.' },
  'marketing': { name: 'Migration + Marketing', price: '$799', features: ['Full migration','Google Ads setup','Facebook Pixel','Email marketing','Performance tracking'], note: 'One-time payment.' },
  'support': { name: 'Monthly Support', price: '$150/mo', features: ['Technical help','Updates & fixes','Optimization','Priority chat','Weekly reports'], note: 'Billed monthly. Cancel anytime.' }
};
function openModal(pkgKey) {
  const pkg = packages[pkgKey] || packages['full'];
  document.getElementById('modalPackageName').textContent = pkg.name;
  document.getElementById('modalPrice').textContent = pkg.price;
  document.getElementById('summaryName').textContent = pkg.name;
  document.getElementById('summaryPrice').textContent = pkg.price.includes('/') ? pkg.price : (pkg.price === 'Free' ? '$0.00' : pkg.price + '.00');
  document.getElementById('summaryTotal').textContent = 'USD ' + (pkg.price.includes('/') ? pkg.price : (pkg.price === 'Free' ? '$0.00' : pkg.price + '.00'));
  const featList = document.getElementById('modalFeatures');
  featList.innerHTML = pkg.features.map(f => '<li><span class="check-icon">✓</span> ' + f + '</li>').join('');
  document.getElementById('modalNote').textContent = pkg.note;
  document.getElementById('checkoutModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('checkoutModal').classList.remove('active');
  document.body.style.overflow = '';
}
function openFormModal() {
  document.getElementById('googleFormFrame').src = 'https://docs.google.com/forms/d/e/1rcTN_hQ9OXAloyxguB2f0iCRDyTFnhd4gYAME8HaHq4/viewform?embedded=true';
  document.getElementById('formModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeFormModal() {
  document.getElementById('formModal').classList.remove('active');
  document.getElementById('googleFormFrame').src = '';
  document.body.style.overflow = '';
}
document.getElementById('checkoutModal').addEventListener('click', (e) => { if(e.target === document.getElementById('checkoutModal')) closeModal(); });
document.getElementById('formModal').addEventListener('click', (e) => { if(e.target === document.getElementById('formModal')) closeFormModal(); });
function handlePayment(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.pay-btn');
  btn.textContent = 'Processing...';
  btn.style.opacity = '0.7';
  setTimeout(() => {
    btn.textContent = '✓ Payment Simulated';
    btn.style.background = 'linear-gradient(135deg,#4ade80,#22c55e)';
    setTimeout(() => { closeModal(); btn.textContent = 'Pay now'; btn.style.background = ''; btn.style.opacity = '1'; e.target.reset(); }, 1500);
  }, 1500);
}
</script>

<!-- ===== GOOGLE FORM MODAL ===== -->
<div id="formModal" class="modal-overlay">
  <div class="modal-container form-modal-container">
    <button class="modal-close" onclick="closeFormModal()">✕</button>
    <iframe id="googleFormFrame" src="" frameborder="0" allowfullscreen></iframe>
  </div>
</div>
</body>
</html>
